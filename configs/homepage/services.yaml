---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- Infrastructures:
    - Nginx Proxy Manager:
        icon: nginx-proxy-manager
        href: https://proxmanager.daffy.lan
        description: Domain Traffic Controller
        container: nginx-proxy-manager
        widget:
          type: npm
          url: https://proxmanager.daffy.lan
          username: <USERNAME>
          password: <PASSWORD>

    - AdGuard Home:
        icon: adguard-home
        href: https://adguard.daffy.lan
        description: DNS Adblocker
        container: adguardhome
        widget:
          type: adguard
          url: https://adguard.daffy.lan
          username: <USERNAME>
          password: <PASSWORD>

    - qBittorrent:
        icon: qbittorrent
        href: https://loot.daffy.lan
        description: My Beloved Ship
        container: qbittorrent
        widget:
          type: qbittorrent
          url: https://loot.daffy.lan
          username: <USERNAME>
          password: <PASSWORD>
#          enableLeechProgress: true
#          enableLeechSize: true

- Automation:
    - Radarr:
        icon: radarr
        href: https://radar.daffy.lan
        description: Movie Manager
        container: radarr
        widget:
          type: radarr
          url: https://radar.daffy.lan
          key: <KEY>

    - Seerr:
        icon: seerr
        href: https://seerr.daffy.lan
        description: Media Request Manager
        container: seerr
        widget:
          type: seerr
          url: https://seerr.daffy.lan
          key: <KEY>

    - Sonarr:
        icon: sonarr
        href: https://sonar.daffy.lan
        description: Series Manager
        container: sonarr
        widget:
          type: sonarr
          url: https://sonar.daffy.lan
          key: <KEY>

- Media and Files:
    - Jellyfin:
        icon: jellyfin
        href: https://cinema.daffy.lan
        description: Personal Cinema
        container: jellyfin
        statusStyle: "dot"
        widget:
          type: jellyfin
          url: https://cinema.daffy.lan
          key: <KEY>
          enableBlocks: true

    - Navidrome:
        icon: navidrome
        href: https://music.daffy.lan
        description: Personal Spotify
        container: navidrome
        statusStyle: "dot"
        widget:
          type: navidrome
          url: https://music.daffy.lan
          user: <USERNAME>
          token: <TOKEN>
          salt: <SALT>

    - Filebrowser:
        icon: filebrowser
        href: https://files.daffy.lan
        description: Personal Drive
        container: filebrowser
        statusStyle: "dot"
        widget:
          type: filebrowser
          url: https://files.daffy.lan
          username: <USERNAME>
          password: <PASSWORD>
