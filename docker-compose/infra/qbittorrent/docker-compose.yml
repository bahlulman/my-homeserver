services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
      - WEBUI_PORT=8080
    volumes:
      - ./config:/config
      - ~/media:/media    # <--- Semua film akan mendarat di folder media kamu
#    ports:
#      - 6881:6881             # Port wajib untuk koneksi peer-to-peer torrent
#      - 6881:6881/udp
    restart: unless-stopped
    networks:
      - npm-net

networks:
  npm-net:
    external: true
