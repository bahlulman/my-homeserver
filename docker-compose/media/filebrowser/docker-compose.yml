services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - FB_DATABASE=/config/filebrowser.db
    volumes:
      - ~/files:/srv/files            # Folder data lama kita taruh di dalam folder 'files'
      - ~/media:/srv/media           # Ini jembatan baru ke folder media di luar
      - ~/backups:/srv/backups
      - .db:/db
    networks:
      - npm-net

networks:
  npm-net:
    external: true
