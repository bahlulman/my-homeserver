services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    user: "1000:1000"
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Jakarta
#      - PORT=5055 #optional
#    ports:
#      - 5055:5055
    volumes:
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - npm-net

networks:
  npm-net:
    external: true
