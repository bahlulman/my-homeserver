services:
  sonarr:
      image: lscr.io/linuxserver/sonarr:latest
      container_name: sonarr
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=Asia/Jakarta
      volumes:
        - ./sonarr-config:/config
        - ~/media:/media
#    ports:
#      - 8989:8989
      restart: unless-stopped
      networks:
        - npm-net

networks:
  npm-net:
    external: true
